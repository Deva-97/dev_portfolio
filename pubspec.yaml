name: dev_portfolio
description: Devendiran's Flutter Portfolio
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  url_launcher: ^6.1.7
  animations: ^2.0.6
  flutter_svg: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/flutter logo.svg
    - assets/images/linkedin.svg
    - assets/images/dart.svg
    - assets/images/firebase.svg
    - assets/images/github_logo.svg
    - assets/images/api.svg
    - assets/images/resume.svg
    - assets/images/dev_portfolio.png
    - assets/images/logo.png
    - assets/images/smart_things.png
    - assets/images/mudhal_ai.png
    - assets/images/tab_app.png
    - assets/images/workspace.png
    - assets/images/architecture.png
    - assets/images/state_management.png
    - assets/images/mqtt.svg
    - assets/images/devices.png
    - assets/images/app_deployment.png
    - assets/images/aquacare_crm.png
    - assets/images/ninaivu.png
    - assets/images/projects/aquacare_1.webp
    - assets/images/projects/aquacare_2.webp
    - assets/images/projects/aquacare_3.webp
    - assets/images/projects/mudhal_ai_1.webp
    - assets/images/projects/mudhal_ai_2.webp
    - assets/images/projects/mudhal_ai_3.webp
    - assets/images/projects/onwords_smart_things_1.webp
    - assets/images/projects/onwords_smart_things_2.webp
    - assets/images/projects/onwords_smart_things_3.webp
    - assets/images/projects/ninaivu_1.webp
    - assets/images/projects/ninaivu_2.webp
    - assets/images/projects/ninaivu_3.webp
    - assets/images/projects/onwords_st_1.webp
    - assets/images/projects/onwords_st_2.webp
    - assets/images/projects/onwords_st_3.webp
    - assets/images/projects/onwords_workspace_1.webp
    - assets/images/projects/onwords_workspace_2.webp
    - assets/images/projects/onwords_workspace_3.webp

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          weight: 400
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700
